<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Wedding Gallery</title>

    <style>
        body {
            overflow-x: hidden;
        }

        .hero-image {
            animation: zoomFloat 18s ease-in-out infinite alternate;
        }

        @keyframes zoomFloat {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.08);
            }
        }

        .fade-overlay {
            background: linear-gradient(to top,
                    rgba(0, 0, 0, .55),
                    rgba(0, 0, 0, .15),
                    transparent 60%);
        }

        .scroll-arrow {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(8px);
            }
        }
    </style>

</head>

<body>

    <section class="relative w-screen h-screen overflow-hidden">

        <!-- Background Image -->
        <img src="/Assets/img.jpg" class="hero-image absolute inset-0 w-full h-full object-cover" alt="Wedding Couple">

        <!-- Overlay -->
        <div class="fade-overlay absolute inset-0"></div>

        <!-- Bottom Content -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-full px-8 text-center z-20">

            <!-- Decorative Line -->
            <div class="flex items-center justify-center gap-4 mb-6">

                <span class="w-12 h-px bg-white/60"></span>

                <!-- Muse / Sparkles Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white/90" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">

                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z" />

                </svg>

                <span class="w-12 h-px bg-white/60"></span>

            </div>

            <!-- Paragraph -->
            <p class="text-white/90
              max-w-[320px]
              mx-auto
              leading-7
              text-base
              italic" style="font-family:'Adobe Caslon Pro', serif;">

                Every beautiful journey begins with a single step.
                We warmly invite you to scroll down and celebrate
                our love story.

            </p>



            <!-- Mouse Icon -->
            <div class="mt-5 flex justify-center">

                <div class="w-8 h-12 rounded-full border border-white/70 flex justify-center">

                    <span class="w-1 h-2 rounded-full bg-white mt-2 animate-scroll"></span>

                </div>

            </div>

            <!-- Arrow -->
            <a href="/home.html">
                <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto mt-3 w-6 h-6 text-white animate-bounce"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />

                </svg></a>

        </div>

    </section>

</body>

</html>
