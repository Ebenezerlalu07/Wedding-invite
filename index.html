<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body id="pageContent" class="bg-[#F6F5EF] overflow-hidden opacity-0">

    <section id="splashScreen" class="relative min-h-screen overflow-hidden bg-[#F6F5EF]">

        <!-- Flower Circle -->
        <div class="absolute
    top-4
    sm:top-6
    md:top-8
    lg:top-10
    left-1/2
    -translate-x-1/2
    z-10
    w-screen">

            <div class="relative">

                <img src="/Assets/Round Couples.png" alt="Flower"
                    class="w-full h-auto mx-auto -mt-16 sm:-mt-12 md:-mt-6 lg:mt-0">

                <!-- Names -->
                <div class="absolute inset-x-0 top-[80%] -translate-y-1/2 flex flex-col items-center text-center">

                    <h1 class="couple-name">
                        STANLY <br>
                        JOHNSON
                    </h1>

                    <p class="couple-with">
                        with
                    </p>

                    <h1 class="couple-name">
                        KEZIYAMOL <br>
                        AJU
                    </h1>

                </div>
            </div>

        </div>

        <!-- Tap -->
        <div id="tapOpen"
            class="absolute bottom-16 sm:bottom-20 md:bottom-12 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center cursor-pointer">

            <img src="/Assets/tap.png" class="w-6 sm:w-7 md:w-8 tap-animation" alt="Tap">

            <p class="font-avenir text-[#6F7752] text-sm sm:text-base md:text-lg mt-2">
                Tap to Open
            </p>

        </div>

        <style>
            .couple-name {
                font-family: "Perpetua Light", serif;
                text-transform: uppercase;
                color: #6F7752;
                font-size: clamp(2.4rem, 8vw, 7.8rem);
                line-height: 0.9;
                letter-spacing: 2px;
                margin: 0;
            }

            .couple-with {
                font-family: "Adobe Caslon Pro", serif;
                font-style: italic;
                color: #6F7752;
                font-size: clamp(1.2rem, 2vw, 2.6rem);
                margin: 1rem 0;
            }

            .tap-animation {
                display: block;
                will-change: transform;
                backface-visibility: hidden;
                transform: translateZ(0);
                animation: tapFloat 1.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            }

            @keyframes tapFloat {
                0% {
                    transform: translate3d(0, 0, 0);
                }

                50% {
                    transform: translate3d(0, -12px, 0);
                }

                100% {
                    transform: translate3d(0, 0, 0);
                }
            }

            #tapOpen p {
                animation: textFloat 1.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                will-change: transform;
            }

            @keyframes textFloat {
                0% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-4px);
                }

                100% {
                    transform: translateY(0);
                }
            }

            .tap-animation {
                animation: tapFloat 2.2s ease-in-out infinite;
                will-change: transform;
                transform: translateZ(0);
            }

            @keyframes tapFloat {

                0%,
                100% {
                    transform: translate3d(0, 0, 0);
                }

                25% {
                    transform: translate3d(0, -4px, 0);
                }

                50% {
                    transform: translate3d(0, -10px, 0);
                }

                75% {
                    transform: translate3d(0, -4px, 0);
                }
            }

            @keyframes tapFloat {
                0% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }

                50% {
                    transform: translateY(-10px) scale(1.08);
                    opacity: 0.8;
                }

                100% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
            }


            #tapOpen {
                transition: opacity .3s ease;
            }

            #tapOpen.hide {
                opacity: 0;
                pointer-events: none;
            }

            #splashScreen {
                transform: translateY(0);
                transition: transform 1s ease-in-out;
                will-change: transform;
            }

            #splashScreen.slide-up {
                transform: translateY(-100%);
            }
        </style>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("pageContent").classList.remove("opacity-0");
            });

            const splash = document.getElementById("splashScreen");
            const tap = document.getElementById("tapOpen");

            tap.addEventListener("click", () => {
                // Hide the button immediately
                tap.classList.add("hide");

                // Slide the splash screen
                splash.classList.add("slide-up");
                document.body.classList.add("page-leave");

                // Navigate after the slide animation finishes
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 900);
            });
        </script>

</body>

</html>
