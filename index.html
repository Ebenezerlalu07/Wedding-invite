<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-[#F6F5EF] overflow-hidden">

    <section id="splashScreen" class="relative min-h-screen overflow-hidden bg-[#F6F5EF]">

        <img src="/Assets/Gradient.png" alt="Background" class="absolute left-1/2 -translate-x-1/2 z-0 pointer-events-none select-none
           w-[140%] md:w-[120%] lg:w-[110%]" style="top: -12px;">

        <!-- Flower Circle -->
        <div class="absolute
        top-4
        sm:top-6
        md:top-8
        lg:top-10
        left-1/2
        -translate-x-1/2
        z-10">

            <div class="relative">

                <!-- Flower -->
                <img src="/Assets/Round Flowers.png" alt="Flower" class="animate-float
                w-[92vw]
                max-w-[360px]
                sm:max-w-[500px]
                md:max-w-[650px]
                lg:max-w-[760px]
                xl:max-w-[820px]">

                <!-- Names -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">

                    <h1 class="font-perpetua-light uppercase text-[#6F7752]
                    text-[24px]
                    sm:text-[34px]
                    md:text-[44px]
                    lg:text-[56px]
                    leading-tight">

                        STANLY <br>
                        JOHNSON

                    </h1>

                    <p class="font-caslon italic text-[#6F7752]
                    text-base
                    sm:text-lg
                    md:text-xl
                    my-2
                    md:my-4">

                        with

                    </p>

                    <h1 class="font-perpetua-light uppercase text-[#6F7752]
                    text-[24px]
                    sm:text-[34px]
                    md:text-[44px]
                    lg:text-[56px]
                    leading-tight">

                        KEZIYAMOL <br>
                        AJU

                    </h1>

                </div>

            </div>

        </div>

        <!-- Tap -->
        <div id="tapOpen"
            class="absolute bottom-8 sm:bottom-10 md:bottom-12 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center cursor-pointer">

            <img src="/Assets/tap.png" class="w-8 md:w-10 tap-animation" alt="Tap">

            <p class="font-avenir text-[#6F7752] text-lg sm:text-xl md:text-2xl mt-3">
                Tap to Open
            </p>

        </div>

        <style>
            #tapOpen {
                transition: opacity .3s ease;
            }

            #tapOpen.hide {
                opacity: 0;
                pointer-events: none;
            }

            #splashScreen {
                transform: translateY(0);
                transition: transform 1s ease-in-out;
                will-change: transform;
            }

            #splashScreen.slide-up {
                transform: translateY(-100%);
            }
        </style>

        <script>
            const splash = document.getElementById("splashScreen");
            const tap = document.getElementById("tapOpen");

            tap.addEventListener("click", () => {
                // Hide the button immediately
                tap.classList.add("hide");

                // Slide the splash screen
                splash.classList.add("slide-up");
            });
        </script>

        <script>

            document.getElementById("tapOpen").onclick = () => {

                document.body.classList.add("page-leave");

                setTimeout(() => {

                    window.location.href = "home.html";

                }, 900);

            }

        </script>

</body>

</html>
