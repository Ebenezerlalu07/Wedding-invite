<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body id="pageContent" class="bg-[#F6F5EF] overflow-hidden opacity-0">

    <section id="splashScreen" class="relative min-h-screen overflow-hidden bg-[#F6F5EF]">

        <!-- Flower Circle -->
        <div class="absolute
    top-4
    sm:top-6
    md:top-8
    lg:top-10
    left-1/2
    -translate-x-1/2
    z-10
    w-screen">

            <div class="relative">

                <img src="/Assets/Round Couples.png" alt="Flower"
                    class="w-full h-auto mx-auto -mt-16 sm:-mt-12 md:-mt-6 lg:mt-0">

                <!-- Names -->


                <!-- Groom & Bride -->
                <div
                    class="font-perpetua-light absolute inset-x-0 top-[90%] -translate-y-1/2 flex flex-col items-center text-center">
                    <h1 class="uppercase
    text-[#7D8665]
    text-[42px] sm:text-[56px] md:text-[72px] lg:text-[88px]
    leading-none
    text-center">

                        <span class="block text-reveal" data-reveal-text data-reveal-mode="letter">
                            Stanly
                        </span>

                        <span class="block -mt-2 text-reveal" data-reveal-text data-reveal-mode="letter">
                            Johnson
                        </span>

                    </h1>

                    <p class="caslon italic mt-3 sm:mt-4 text-[#8E9770] fluid-and reveal">
                        with
                    </p>


                    <h1 class="font-perpetua-light uppercase
    text-[#7D8665]
    text-[42px] sm:text-[56px] md:text-[72px] lg:text-[88px]
    leading-[1.1]
    text-center">



                        <span class="block text-reveal" data-reveal-text data-reveal-mode="letter">
                            Keziyamol
                        </span>

                        <span class="block -mt-2 text-reveal" data-reveal-text data-reveal-mode="letter">
                            Aju
                        </span>

                    </h1>


                    <div class="mt-12 sm:mt-16 md:mt-20 lg:mt-28 reveal">
                        <h3 class="caslon italic text-[#7D8665] fluid-parent-name">
                            Daughter of Pr. Aju Varghese &amp; <br> Mrs. Annamma Aju,
                        </h3>
                    </div>

                    <p class="caslon italic regular text-[#87a254] fluid-address-line mt-3 sm:mt-4 reveal">
                        Puthuparambil Ebenezer, <br> Manganam, Kottayam.
                    </p>
                </div>
            </div>

        </div>

        <!-- Tap -->
        <div id="tapOpen"
            class="absolute bottom-12 sm:bottom-16 md:bottom-10 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center cursor-pointer">

            <img src="/Assets/tap.png" class="tap-animation w-6 sm:w-7 md:w-8" alt="Tap">

            <p class="font-avenir text-[#6F7752] text-sm sm:text-base md:text-lg mt-2">
                Tap to Open
            </p>

        </div>

        <style>
            .couple-with {
                font-family: "Adobe Caslon Pro", serif;
                font-style: italic;
                color: #6F7752;
                font-size: clamp(1.2rem, 2vw, 2.6rem);
                margin: 1rem 0;
            }

            /* Tap Animation */
            .tap-animation {
                display: block;
                transform: translateZ(0);
                will-change: transform, opacity;
                animation: tapFloat 2s ease-in-out infinite;
            }

            #tapOpen p {
                will-change: transform;
                animation: textFloat 2s ease-in-out infinite;
            }

            @keyframes tapFloat {

                0%,
                100% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }

                50% {
                    transform: translateY(-10px) scale(1.08);
                    opacity: .8;
                }
            }

            @keyframes textFloat {

                0%,
                100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-4px);
                }
            }

            /* Tap Hide */
            #tapOpen {
                transition: opacity .3s ease;
            }

            #tapOpen.hide {
                opacity: 0;
                pointer-events: none;
            }

            /* Splash Screen */
            #splashScreen {
                position: fixed;
                inset: 0;
                background: #F6F5EF;
                z-index: 9999;
                overflow: hidden;
                transform: translateY(0);
                transition: transform .9s cubic-bezier(.65, .05, .36, 1);
                will-change: transform;
            }

            #splashScreen.slide-up {
                transform: translateY(-100%);
            }
        </style>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("pageContent").classList.remove("opacity-0");
            });

            const splash = document.getElementById("splashScreen");
            const tap = document.getElementById("tapOpen");

            tap.addEventListener("click", () => {
                // Hide the button immediately
                tap.classList.add("hide");

                // Slide the splash screen
                splash.classList.add("slide-up");
                document.body.classList.add("page-leave");

                // Navigate after the slide animation finishes
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 900);
            });
        </script>




        <!-- Loader -->
        <div id="loader">
            <div class="spinner"></div>
        </div>

        <!-- Page Content -->
        <div id="pageContent" class="hidden-content">
            <!-- Everything on your page goes here -->
        </div>


        <style>
            body.loaded {
                overflow: auto;
            }

            #loader {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                transition: opacity .1s ease;
            }

            #loader.hide {
                opacity: 0;
                pointer-events: none;
            }

            /* Hide page until loader finishes */
            .hidden-content {
                opacity: 0;
                visibility: hidden;
                transition: opacity .6s ease;
            }

            .hidden-content.show {
                opacity: 1;
                visibility: visible;
            }

            .spinner {
                width: 45px;
                height: 45px;
                border: 4px solid #d8d8d8;
                border-top: 4px solid #6F7752;
                border-radius: 50%;
                animation: spin .8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>


        <script>window.addEventListener("load", () => {
                const loader = document.getElementById("loader");
                const page = document.getElementById("pageContent");

                // Wait a little to ensure everything is painted
                setTimeout(() => {

                    // Show page
                    page.classList.add("show");
                    document.body.classList.add("loaded");

                    // Fade loader
                    loader.classList.add("hide");

                    // Remove loader after fade
                    loader.addEventListener("transitionend", () => {
                        loader.remove();
                    }, { once: true });

                }, 500);
            });</script>




</body>

</html>
