<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-[#F6F5EF] overflow-hidden">

    <section class="relative w-screen h-screen overflow-hidden">

        <img src="/Assets/Gradient.png" alt="Background" class="absolute
           -top-8
           left-1/2
           -translate-x-1/2
           w-[120%]
           max-w-[1200px]
           md:max-w-[1400px]
           lg:max-w-[1600px]
           h-auto
           object-contain
           pointer-events-none
           select-none
           -z-10">

        <style>
            .hero-gradient {
                position: absolute;
                top: -40px;
                left: 50%;
                transform: translateX(-50%);
                width: min(1400px, 110%);
                height: auto;
                pointer-events: none;
                user-select: none;
                z-index: -1;
            }
        </style>

        <!-- Flower Circle -->
        <div class="absolute top-6 sm:top-8 md:top-10 left-1/2 -translate-x-1/2">

            <!-- Flower -->
            <img src="/Assets/Round Flowers.png" class="flower-circle
           w-[105vw]
           max-w-[820px]
           animate-float" alt="Flower Circle">

            <!-- Center Text -->
            <div class="animate-fade-in absolute inset-0 flex flex-col items-center justify-center text-center">

                <h1 class="font-perpetua-light
               uppercase
               text-[#6F7752]
               text-[30px]
               sm:text-[38px]
               md:text-[48px]
               lg:text-[56px]
               leading-[1.08]">

                    STANLY
                    <br>
                    JOHNSON

                </h1>

                <p class="font-caslon
               italic
               text-[#6F7752]
               text-lg
               sm:text-xl
               my-4">

                    with

                </p>

                <h1 class="font-perpetua-light
               uppercase
               text-[#6F7752]
               text-[30px]
               sm:text-[38px]
               md:text-[48px]
               lg:text-[56px]
               leading-[1.08]">

                    KEZIYAMOL
                    <br>
                    AJU

                </h1>

            </div>

        </div>

        <!-- Tap -->
        <div id="tapOpen"
            class="absolute bottom-16 left-1/2 -translate-x-1/2 flex flex-col items-center cursor-pointer">

            <img src="/Assets/tap.png" class="w-8 tap-animation" alt="Tap">

            <p class="font-avenir
                   text-[#6F7752]
                   text-2xl
                   mt-4">

                Tap to Open

            </p>

        </div>

    </section>

    <script>

        document.getElementById("tapOpen").onclick = () => {

            document.body.classList.add("page-leave");

            setTimeout(() => {

                window.location.href = "home.html";

            }, 900);

        }

    </script>

</body>

</html>
